<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>频率声音播放器</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #16161a;
    --panel2: #1e1e24;
    --line: #2a2a32;
    --text: #e8e8ea;
    --dim: #8b8b96;
    --accent: #34c759;
    --accent-dim: #1e6b33;
    --danger: #ff453a;
    --warn: #ffd60a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.5;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 520px; }

  h1 { font-size: 20px; font-weight: 600; margin: 8px 0 20px; text-align: center; letter-spacing: 0.02em; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .card-label { font-size: 13px; color: var(--dim); margin-bottom: 10px; letter-spacing: 0.04em; }

  /* 频率显示 */
  .freq-display {
    text-align: center; padding: 8px 0 4px;
  }
  .freq-value {
    font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.1; letter-spacing: -0.03em;
  }
  .freq-unit { font-size: 20px; color: var(--dim); font-weight: 500; }

  /* 滑块 */
  .freq-slider-wrap { padding: 4px 0 8px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: var(--line); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }

  /* 波形选择 */
  .wave-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .wave-btn {
    min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel2); color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s, border-color .15s;
    font-family: inherit;
  }
  .wave-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .wave-btn:active { background: #26262e; }

  /* 预设频率 */
  .presets {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  .preset-btn {
    min-height: 32px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel2); color: var(--dim);
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: border-color .15s, color .15s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--text); }
  .preset-btn:active { background: #26262e; }

  /* 参数 */
  .params { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--dim); }
  .field .unit { font-size: 12px; color: #5c5c66; }
  input[type=number] {
    width: 100%; min-height: 50px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text);
    font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;
    text-align: center; padding: 0 8px;
    -moz-appearance: textfield;
  }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .switch-row .sw-label { font-size: 14px; }
  .switch-row .sw-desc { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .switch { position: relative; width: 50px; height: 30px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #33333d;
    border-radius: 15px; transition: background .2s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; width: 24px; height: 24px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%;
    transition: transform .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* 控制按钮 */
  .controls { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .btn {
    min-height: 60px; border: none; border-radius: 12px;
    font-size: 18px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity .15s, transform .1s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-start { background: var(--accent); color: #04140a; }
  .btn-stop { background: var(--danger); color: #fff; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-test { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }

  /* 状态 */
  .status-card { text-align: center; }
  .big-timer {
    font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.1; letter-spacing: -0.02em;
    margin: 4px 0 2px;
  }
  .big-timer.playing { color: var(--accent); }
  .big-timer.waiting { color: var(--warn); }
  .big-label { font-size: 13px; color: var(--dim); letter-spacing: 0.06em; }
  .meta { display: flex; justify-content: space-around; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .meta div { font-size: 13px; color: var(--dim); }
  .meta b { display: block; font-size: 17px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }

  /* 提示条 */
  .notice {
    font-size: 13px; line-height: 1.65; color: var(--dim);
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--warn);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
  }
  .notice b { color: var(--text); font-weight: 600; }
  .notice.err { border-left-color: var(--danger); }
  .notice.ok { border-left-color: var(--accent); }
  .notice:empty { display: none; }

  .hidden { display: none !important; }

  /* 幅度控制 */
  .amp-row {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
  }
  .amp-row .sw-label { font-size: 14px; flex: 0 0 auto; min-width: 60px; }
  .amp-row input[type=range] { flex: 1; }
  .amp-val {
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--accent); min-width: 48px; text-align: right;
  }
  .amp-presets {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  .amp-preset-btn {
    min-height: 32px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel2); color: var(--dim);
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: border-color .15s, color .15s;
  }
  .amp-preset-btn:hover { border-color: var(--accent); color: var(--text); }
  .amp-preset-btn:active { background: #26262e; }

  /* 通道卡片 */
  .ch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .ch-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .ch-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .ch-body { transition: opacity .2s; }
  .ch-body.off { opacity: 0.4; pointer-events: none; }

  /* 文件选择 */
  .file-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 52px;
    background: var(--panel2); border: 1px dashed var(--line);
    border-radius: 10px; color: var(--text);
    font-size: 15px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .file-btn:active { background: #26262e; }
  .file-btn.has-file { border-style: solid; border-color: var(--accent-dim); }
  input[type=file] { display: none; }
  .file-info { margin-top: 10px; font-size: 13px; color: var(--dim); word-break: break-all; }
  .file-info b { color: var(--text); font-weight: 500; }

  /* 通道状态行 */
  .ch-lines { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .ch-line { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; color: var(--dim); }
  .ch-line b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .ch-line b.playing { color: var(--accent); }
  .ch-line b.waiting { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">

  <h1>频率声音播放器</h1>

  <div id="notice" class="notice hidden"></div>

  <!-- 正弦波通道 -->
  <div class="card">
    <div class="ch-head">
      <div>
        <div class="ch-title">正弦波通道</div>
        <div class="ch-sub">按 Hz 出纯音，波形可换</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="oscOn" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="ch-body" id="oscBody">
      <div class="card-label">频率</div>
      <div class="freq-display">
        <span class="freq-value" id="freqValue">440</span>
        <span class="freq-unit">Hz</span>
      </div>
      <div class="freq-slider-wrap">
        <input type="range" id="freqSlider" min="0" max="1000" value="693" step="1">
      </div>
      <div class="card-label" style="margin-top:0">波形</div>
      <div class="wave-row">
        <button class="wave-btn active" data-wave="sine">正弦</button>
        <button class="wave-btn" data-wave="square">方波</button>
        <button class="wave-btn" data-wave="sawtooth">锯齿</button>
        <button class="wave-btn" data-wave="triangle">三角</button>
      </div>
      <div class="presets" id="presets"></div>

      <div class="card-label" style="margin-top:16px">播放参数</div>
      <div class="params">
        <div class="field">
          <label for="oscPlaySec">播放时长</label>
          <input type="number" id="oscPlaySec" value="3" min="0.5" step="0.5" inputmode="decimal">
          <span class="unit">秒（每轮响这么久）</span>
        </div>
        <div class="field">
          <label for="oscGapSec">间隔时长</label>
          <input type="number" id="oscGapSec" value="30" min="0" step="0.5" inputmode="decimal">
          <span class="unit">秒（从上次结束算起）</span>
        </div>
      </div>
      <div class="switch-row">
        <div>
          <div class="sw-label">循环播放</div>
          <div class="sw-desc" id="oscLoopDesc">播放完等间隔后自动再响</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="oscLoop" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="amp-row">
        <span class="sw-label">音量</span>
        <input type="range" id="oscVol" min="0" max="100" value="100" step="1">
        <span class="amp-val" id="oscVolValue">100%</span>
      </div>
      <div class="amp-row">
        <span class="sw-label">幅度变化</span>
        <input type="range" id="ampRange" min="0" max="100" value="0" step="1">
        <span class="amp-val" id="ampValue">0%</span>
      </div>
      <div class="amp-presets" id="ampPresets"></div>
    </div>
  </div>

  <!-- 音频通道 -->
  <div class="card">
    <div class="ch-head">
      <div>
        <div class="ch-title">音频通道</div>
        <div class="ch-sub">播放手机里的音频文件</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="audOn">
        <span class="slider"></span>
      </label>
    </div>
    <div class="ch-body off" id="audBody">
      <label class="file-btn" id="fileBtn" for="fileInput">
        <span id="fileBtnText">选择手机里的音频文件</span>
      </label>
      <input type="file" id="fileInput" accept="audio/*">
      <div class="file-info hidden" id="fileInfo"></div>

      <div class="card-label" style="margin-top:16px">播放参数</div>
      <div class="params">
        <div class="field">
          <label for="audPlaySec">播放时长</label>
          <input type="number" id="audPlaySec" value="3" min="0.5" step="0.5" inputmode="decimal">
          <span class="unit">秒（每轮响这么久）</span>
        </div>
        <div class="field">
          <label for="audGapSec">间隔时长</label>
          <input type="number" id="audGapSec" value="30" min="0" step="0.5" inputmode="decimal">
          <span class="unit">秒（从上次结束算起）</span>
        </div>
      </div>
      <div class="switch-row">
        <div>
          <div class="sw-label">循环播放</div>
          <div class="sw-desc" id="audLoopDesc">播放完等间隔后自动再响</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="audLoop" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="amp-row">
        <span class="sw-label">音量</span>
        <input type="range" id="audVol" min="0" max="100" value="80" step="1">
        <span class="amp-val" id="audVolValue">80%</span>
      </div>
    </div>
  </div>

  <!-- 状态 -->
  <div class="card status-card">
    <div class="big-label" id="stateLabel">未开始</div>
    <div class="big-timer" id="bigTimer">--</div>
    <div class="big-label" id="timerHint">等待开始</div>
    <div class="ch-lines">
      <div class="ch-line"><span>正弦波</span><b id="oscLine">已关闭</b></div>
      <div class="ch-line"><span>音频</span><b id="audLine">已关闭</b></div>
    </div>
    <div class="meta">
      <div>已运行<b id="elapsed">0:00</b></div>
      <div>唤醒锁<b id="wakeState">未启用</b></div>
    </div>
  </div>

  <!-- 控制 -->
  <div class="controls">
    <button class="btn btn-start" id="startBtn">开始播放</button>
    <div class="btn-row">
      <button class="btn btn-stop" id="stopBtn" disabled>停止</button>
      <button class="btn btn-test" id="testBtn">试听一次</button>
    </div>
    <button class="btn btn-test" id="fsBtn">全屏显示</button>
  </div>

</div>

<script>
"use strict";

// 调试通道：异常与关键动作发到本地服务器的 /__log，后台可读
function post(obj) {
  try { fetch("/__log", { method: "POST", body: JSON.stringify(obj) }).catch(() => {}); } catch (e) {}
}
window.addEventListener("error", e => post({
  tag: "player-error",
  msg: e.message,
  where: e.filename + ":" + e.lineno,
  stack: e.error && e.error.stack ? String(e.error.stack) : ""
}));
window.addEventListener("unhandledrejection", e => {
  const r = e.reason;
  post({ tag: "player-reject", msg: r && (r.stack || r.message) ? String(r.stack || r.message) : String(r) });
});

// ---------- 状态 ----------
let ctx = null;
let limiter = null;             // 两通道共用限幅器，防叠加削波
let oscVolGain = null;          // 正弦波通道音量，改动实时生效
let audVolGain = null;          // 音频通道音量，改动实时生效
let running = false;
let runStartAudio = 0;
let runStartPerf = 0;
let wakeLock = null;
let pumpTimer = null;
let uiTimer = null;
let audioBuffer = null;

const CH_NAME = { osc: "正弦波", aud: "音频" };
const CH_KEYS = ["osc", "aud"];
// 每通道一条独立时间轴：events 只放本通道的播放点，cursor 是下一轮排程位置
const chans = {
  osc: { enabled: true, events: [], cursor: 0, rounds: 0 },
  aud: { enabled: false, events: [], cursor: 0, rounds: 0 }
};

const LOOKAHEAD = 30;
const PUMP_MS = 5000;
const FADE = 0.008;             // 音频通道的淡变够用
const STOP_FADE = 1.0;          // 停止淡出用满 1 秒，与干净样本一致
const OSC_HEADROOM = 0.7;       // Web Audio 路径的余量
const OSC_WAVE_LEVEL = 1.0;     // 波形满幅，输出电平由增益节点控制
const OSC_MAX_GAIN = 0.85;      // 音量拉满时的实际峰值，留 1.4dB 防设备端音效削波
const LEAD = 0.15;              // 开始后留一点余量再开第一声

// ---------- 元素 ----------
const $ = id => document.getElementById(id);
const freqSlider = $("freqSlider");
const freqValueEl = $("freqValue");
const oscOnEl = $("oscOn");
const oscBodyEl = $("oscBody");
const oscPlaySecEl = $("oscPlaySec");
const oscGapSecEl = $("oscGapSec");
const oscLoopEl = $("oscLoop");
const oscLoopDescEl = $("oscLoopDesc");
const audOnEl = $("audOn");
const audBodyEl = $("audBody");
const audPlaySecEl = $("audPlaySec");
const audGapSecEl = $("audGapSec");
const audLoopEl = $("audLoop");
const audLoopDescEl = $("audLoopDesc");
const audVolEl = $("audVol");
const audVolValueEl = $("audVolValue");
const fileInput = $("fileInput");
const fileBtn = $("fileBtn");
const fileBtnText = $("fileBtnText");
const fileInfo = $("fileInfo");
const oscVolEl = $("oscVol");
const oscVolValueEl = $("oscVolValue");
const ampRangeEl = $("ampRange");
const ampValueEl = $("ampValue");
const startBtn = $("startBtn");
const stopBtn = $("stopBtn");
const testBtn = $("testBtn");
const fsBtn = $("fsBtn");
const stateLabel = $("stateLabel");
const bigTimer = $("bigTimer");
const timerHint = $("timerHint");
const elapsedEl = $("elapsed");
const oscLineEl = $("oscLine");
const audLineEl = $("audLine");
const wakeStateEl = $("wakeState");
const noticeEl = $("notice");

// ---------- 频率 ----------
let currentFreq = 440;
let currentWave = "sine";

// 对数映射：slider 0~1000 → 20Hz~30000Hz
function sliderToFreq(v) {
  const t = v / 1000;
  return Math.round(20 * Math.pow(30000 / 20, t));
}

function freqToSlider(f) {
  const t = Math.log(f / 20) / Math.log(30000 / 20);
  return Math.round(t * 1000);
}

function fmtFreq(hz) {
  if (hz >= 1000) return (hz / 1000).toFixed(hz % 1000 === 0 ? 0 : 2) + "k";
  return String(hz);
}

function updateFreqDisplay() {
  freqValueEl.textContent = fmtFreq(currentFreq);
}

// ---------- 预设频率 ----------
const PRESETS = [
  { label: "20", hz: 20 },
  { label: "40", hz: 40 },
  { label: "60", hz: 60 },
  { label: "80", hz: 80 },
  { label: "100", hz: 100 },
  { label: "200", hz: 200 },
  { label: "400", hz: 400 },
  { label: "600", hz: 600 },
  { label: "800", hz: 800 },
  { label: "1k", hz: 1000 },
  { label: "2k", hz: 2000 },
  { label: "4k", hz: 4000 },
  { label: "6k", hz: 6000 },
  { label: "8k", hz: 8000 },
  { label: "10k", hz: 10000 },
  { label: "12k", hz: 12000 },
  { label: "14k", hz: 14000 },
  { label: "16k", hz: 16000 },
  { label: "18k", hz: 18000 },
  { label: "20k", hz: 20000 },
];

function buildPresets() {
  const wrap = $("presets");
  wrap.innerHTML = "";
  PRESETS.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.textContent = p.label;
    btn.addEventListener("click", () => setFreq(p.hz));
    wrap.appendChild(btn);
  });
}

function setFreq(hz) {
  currentFreq = Math.max(20, Math.min(30000, Math.round(hz)));
  freqSlider.value = freqToSlider(currentFreq);
  updateFreqDisplay();
}

// ---------- 波形 ----------
document.querySelectorAll(".wave-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".wave-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentWave = btn.dataset.wave;
  });
});

// ---------- 滑块 ----------
freqSlider.addEventListener("input", () => {
  currentFreq = sliderToFreq(parseInt(freqSlider.value));
  updateFreqDisplay();
});

// ---------- 工具 ----------
function showNotice(html, kind) {
  noticeEl.className = "notice" + (kind ? " " + kind : "");
  noticeEl.innerHTML = html;
  noticeEl.classList.remove("hidden");
}

function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h ? 2 : 1, "0");
  const ss = String(s).padStart(2, "0");
  return h ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}

function fmtDur(sec) {
  if (!isFinite(sec)) return "--";
  if (sec < 60) return sec.toFixed(1).replace(/\.0$/, "") + " 秒";
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + " 分 " + s + " 秒";
}

function readSec(el, fallback) {
  const v = parseFloat(el.value);
  return (isFinite(v) && v >= 0.5) ? v : fallback;
}

function paramsOf(key) {
  if (key === "osc") {
    const a = parseFloat(ampRangeEl.value);
    return {
      m: readSec(oscPlaySecEl, 3),
      n: (parseFloat(oscGapSecEl.value) >= 0) ? parseFloat(oscGapSecEl.value) : 0,
      a: (isFinite(a) && a >= 0) ? a : 0
    };
  }
  return {
    m: readSec(audPlaySecEl, 3),
    n: (parseFloat(audGapSecEl.value) >= 0) ? parseFloat(audGapSecEl.value) : 0
  };
}

function loopOf(key) {
  return key === "osc" ? oscLoopEl.checked : audLoopEl.checked;
}

function volOf(el, fallback) {
  const v = parseFloat(el.value);
  return (isFinite(v) && v >= 0) ? Math.min(100, v) / 100 : fallback;
}

// 两通道汇入各自的通道音量，再一起进限幅器
// 地址后加 ?nolimit=1 就绕开压缩器，用来判断爆音是否出在这一级
const BYPASS_LIMIT = new URLSearchParams(location.search).has("nolimit");
// 默认 playback 大缓冲：interactive 缓冲偏小，华为浏览器上会偶发欠载
const LATENCY = new URLSearchParams(location.search).get("latency") || "playback";

function ensureCtx() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("这个浏览器不支持 Web Audio");
    ctx = new AC({ latencyHint: LATENCY });
    if (BYPASS_LIMIT) {
      limiter = ctx.createGain();
      limiter.connect(ctx.destination);
    } else {
      limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -1;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.003;
      limiter.release.value = 0.25;
      limiter.connect(ctx.destination);
    }
    audVolGain = ctx.createGain();
    audVolGain.gain.value = volOf(audVolEl, 0.8);
    audVolGain.connect(limiter);
    oscVolGain = ctx.createGain();
    oscVolGain.gain.value = volOf(oscVolEl, 1);
    oscVolGain.connect(limiter);
  }
  return ctx;
}

// ---------- 正弦通道：audio 元素引擎 ----------
// 华为浏览器上实时合成振荡器起停会爆，改用预渲染波形 + 媒体播放器，与干净的对照样本一致
let oscCtx = null;
let oscBuffer = null;
let oscBufferKey = "";
let oscSrc = null;              // { node, gain } 当前这一轮
let oscPhase = "idle";          // idle / playing / fading / waiting / done
let oscRoundStart = 0;
let oscRoundEnd = 0;
let oscGapEnd = 0;
let oscRoundNo = 0;
let oscTimers = [];

function perfNow() {
  return performance.now() / 1000;
}

function oscClearTimers() {
  oscTimers.forEach(clearTimeout);
  oscTimers = [];
}

// 取整数个周期，loop 接点相位连续，循环处不会咔一声
async function oscEnsureBuffer() {
  const key = currentFreq + "|" + currentWave;
  if (oscBuffer && oscBufferKey === key) return oscBuffer;
  const sr = 44100;
  const seconds = 4;
  const cycles = Math.max(1, Math.round(currentFreq * seconds));
  const length = Math.max(1, Math.round(cycles / currentFreq * sr));
  const off = new OfflineAudioContext(1, length, sr);
  const o = off.createOscillator();
  o.type = currentWave;
  o.frequency.value = currentFreq;
  const g = off.createGain();
  g.gain.value = OSC_WAVE_LEVEL;
  o.connect(g);
  g.connect(off.destination);
  o.start(0);
  oscBuffer = await off.startRendering();
  oscBufferKey = key;
  return oscBuffer;
}

function oscEnsureCtx() {
  if (!oscCtx) {
    oscCtx = new AudioContext({ latencyHint: "playback" });
    post({ tag: "osc-ctx", rate: oscCtx.sampleRate, base: oscCtx.baseLatency || null });
  }
  return oscCtx;
}

function oscTargetVol() {
  const a = parseFloat(ampRangeEl.value);
  const amp = (isFinite(a) && a > 0) ? (1 - a / 100 + Math.random() * (a / 100)) : 1;
  return Math.max(0.0001, volOf(oscVolEl, 1) * amp * OSC_MAX_GAIN);
}

// 每轮一个独立增益，指数包络起落，停止先降到 0.0001 再 stop
function oscFade(ev, to, seconds) {
  if (!oscCtx || !ev) return;
  const now = oscCtx.currentTime;
  const from = Math.max(0.0001, ev.gain.gain.value);
  ev.gain.gain.cancelScheduledValues(now);
  ev.gain.gain.setValueAtTime(from, now);
  ev.gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, to), now + seconds);
}

function oscDispose(ev, delay) {
  setTimeout(() => {
    try { ev.node.stop(); ev.node.disconnect(); ev.gain.disconnect(); } catch (e) {}
  }, delay);
}

async function oscRound() {
  if (!running || !chans.osc.enabled) return;
  const c = oscEnsureCtx();
  await c.resume();
  const buf = await oscEnsureBuffer();
  if (!running || !chans.osc.enabled) return;
  const { m, n } = paramsOf("osc");
  const target = oscTargetVol();
  const node = c.createBufferSource();
  node.buffer = buf;
  node.loop = true;
  const gain = c.createGain();
  gain.gain.value = 0.0001;
  node.connect(gain);
  gain.connect(c.destination);
  node.start();
  const ev = { node: node, gain: gain };
  oscSrc = ev;
  oscRoundNo++;
  oscPhase = "playing";
  oscRoundStart = perfNow();
  oscRoundEnd = oscRoundStart + m;
  oscFade(ev, target, 1.5);
  oscTimers.push(setTimeout(() => {
    if (!running) return;
    oscPhase = "fading";
    oscFade(ev, 0.0001, 1.0);
    oscTimers.push(setTimeout(() => {
      oscDispose(ev, 0);
      if (oscSrc === ev) oscSrc = null;
      if (!running) return;
      if (!loopOf("osc")) { oscPhase = "done"; tickUI(); return; }
      oscPhase = "waiting";
      oscGapEnd = perfNow() + n;
      oscTimers.push(setTimeout(oscRound, n * 1000));
      tickUI();
    }, 1100));
  }, m * 1000));
  tickUI();
}

function oscStop() {
  oscClearTimers();
  oscPhase = "idle";
  const ev = oscSrc;
  if (!ev) return;
  oscSrc = null;
  oscFade(ev, 0.0001, 1.0);
  oscDispose(ev, 1100);
}

async function oscPreview() {
  const c = oscEnsureCtx();
  await c.resume();
  const buf = await oscEnsureBuffer();
  const node = c.createBufferSource();
  node.buffer = buf;
  node.loop = true;
  const gain = c.createGain();
  gain.gain.value = 0.0001;
  node.connect(gain);
  gain.connect(c.destination);
  node.start();
  const ev = { node: node, gain: gain };
  oscFade(ev, oscTargetVol(), 1.0);
  setTimeout(() => {
    oscFade(ev, 0.0001, 1.0);
    oscDispose(ev, 1100);
  }, 3000);
}

function oscView(nowPerf) {
  if (!chans.osc.enabled) return { text: "已关闭", cls: "", live: false, left: null };
  if (oscPhase === "playing" || oscPhase === "fading") {
    const left = Math.max(0, oscRoundEnd - nowPerf);
    return {
      text: "播放中 " + left.toFixed(1) + "s · 第 " + oscRoundNo + " 轮",
      cls: "playing", live: true, left: left
    };
  }
  if (oscPhase === "waiting") {
    const left = Math.max(0, oscGapEnd - nowPerf);
    return {
      text: "静默 " + left.toFixed(1) + "s · 第 " + (oscRoundNo + 1) + " 轮",
      cls: "waiting", live: false, left: left
    };
  }
  if (oscPhase === "done") return { text: "本轮已播完", cls: "", live: false, left: null };
  return { text: "待命", cls: "", live: false, left: null };
}

function rescheduleOsc() {
  if (!running || !chans.osc.enabled) return;
  if (oscPhase !== "waiting") { tickUI(); return; }
  oscClearTimers();
  const { n } = paramsOf("osc");
  oscGapEnd = perfNow() + n;
  oscTimers.push(setTimeout(oscRound, n * 1000));
  tickUI();
}

// ---------- 调度核心 ----------
// 包络固定：起点 0，FADE 内升到 level，末尾 FADE 内落回 0，切在波形中间也不爆音
// 淡变时长按音源给：30Hz 若只淡 8ms，起落本身就是一声闷响
function makeEvent(key, node, out, start, m, level, fade) {
  const gain = ctx.createGain();
  node.connect(gain);
  gain.connect(out);

  const f = Math.min(fade, m / 4);
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(level, start + f);
  gain.gain.setValueAtTime(level, start + m - f);
  gain.gain.linearRampToValueAtTime(0, start + m);

  node.start(start);
  node.stop(start + m);

  const ch = chans[key];
  const ev = { start: start, end: start + m, node: node, gain: gain };
  ch.events.push(ev);
  node.onended = () => {
    const i = ch.events.indexOf(ev);
    if (i >= 0) ch.events.splice(i, 1);
    // 不断开就一直挂在图上，长时间运行节点越积越多
    try { node.disconnect(); gain.disconnect(); } catch (e) {}
  };
  return ev;
}

function scheduleOne(key, t) {
  const { m } = paramsOf(key);
  if (key === "osc") {
    const { a } = paramsOf("osc");
    const osc = ctx.createOscillator();
    osc.type = currentWave;
    osc.frequency.setValueAtTime(currentFreq, t);
    // 随机幅度：每轮在 [1 - a/100, 1] 之间取一个，再乘通道音量
    const amp = a > 0 ? (1 - a / 100 + Math.random() * (a / 100)) : 1;
    // 30Hz 给满 1 秒：30 个周期才收放得住，短淡变就是可闻的一记闷响
    const fade = Math.max(FADE, Math.min(1.0, 30 / currentFreq));
    makeEvent("osc", osc, oscVolGain, t, m, amp * OSC_HEADROOM, fade);
    return;
  }
  if (!audioBuffer) return;
  const src = ctx.createBufferSource();
  src.buffer = audioBuffer;
  // 素材短于播放时长就循环补齐，长于播放时长就播到 M 秒切断
  src.loop = true;
  makeEvent("aud", src, audVolGain, t, m, 1, FADE);
}

function scheduleAhead() {
  if (!running || !ctx) return;
  const now = ctx.currentTime;
  const horizon = now + LOOKAHEAD;
  for (const key of CH_KEYS) {
    const ch = chans[key];
    if (!ch.enabled) continue;
    if (key === "osc") continue;   // 正弦通道走 audio 引擎，不进 Web Audio 时间轴
    if (key === "aud" && !audioBuffer) continue;
    const { m, n } = paramsOf(key);
    let guard = 0;
    while (ch.cursor < horizon && guard++ < 2000) {
      if (ch.cursor >= now) scheduleOne(key, ch.cursor);
      // 单次模式只排一轮，cursor 推到不可能达到的位置
      if (!loopOf(key)) { ch.cursor = Infinity; break; }
      ch.cursor += m + n;
    }
  }
}

function pump() {
  scheduleAhead();
}

function cancelFuture(key, now) {
  const ch = chans[key];
  for (let i = ch.events.length - 1; i >= 0; i--) {
    if (ch.events[i].start > now) {
      try { ch.events[i].node.stop(); } catch (e) {}
      ch.events.splice(i, 1);
    }
  }
}

// 立刻掐掉正在响的这一轮，用淡出代替硬切
// 从当前值起坡：cancelAndHoldAtTime 保留正在跑的包络值，读 .value 可能拿到上一帧
function fadeOut(ev, now, dur) {
  const d = dur || STOP_FADE;
  try {
    const g = ev.gain.gain;
    if (typeof g.cancelAndHoldAtTime === "function") {
      g.cancelAndHoldAtTime(now);
    } else {
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
    }
    g.linearRampToValueAtTime(0, now + d);
    ev.node.stop(now + d + 0.02);
  } catch (e) {}
}

// 参数变了：正在响的那轮不动，只重排它之后的部分
function reschedule(key) {
  if (!running) return;
  if (key === "osc") { rescheduleOsc(); return; }
  if (!ctx) return;
  const ch = chans[key];
  const now = ctx.currentTime;
  const { n } = paramsOf(key);
  let live = null, nextStart = null;
  for (const ev of ch.events) {
    if (ev.start <= now && ev.end > now) live = ev;
    else if (ev.start > now && (nextStart === null || ev.start < nextStart)) nextStart = ev.start;
  }
  cancelFuture(key, now);
  if (!loopOf(key) && live) { ch.cursor = Infinity; return; }
  // 静默期沿用原定的下一次播放时刻，改参数不会凭空插一轮
  ch.cursor = live ? live.end + n : (nextStart !== null ? nextStart : now);
  scheduleAhead();
}

// 运行中单独开关一条通道，不影响另一条
function toggleChannel(key) {
  const ch = chans[key];
  if (!running) { tickUI(); return; }
  if (key === "osc") {
    if (!ch.enabled) oscStop();
    else { oscPhase = "idle"; oscRound(); }
    tickUI();
    return;
  }
  if (!ctx) {
    if (!ch.enabled) { tickUI(); return; }
    ensureCtx();
    runStartAudio = ctx.currentTime;
    ctx.resume().catch(() => {});
  }
  const now = ctx.currentTime;
  if (!ch.enabled) {
    cancelFuture(key, now);
    for (const ev of ch.events) {
      if (ev.start <= now && ev.end > now) fadeOut(ev, now);
    }
    ch.cursor = 0;
  } else {
    ch.cursor = now + 0.1;
    scheduleAhead();
  }
  tickUI();
}

// ---------- 开始 / 停止 ----------
async function start() {
  if (!oscOnEl.checked && !audOnEl.checked) {
    showNotice("两个通道都关着，先打开至少一个再开始。", "");
    return;
  }
  if (audOnEl.checked && !audioBuffer) {
    showNotice("音频通道开着但还没选文件，先选一个音频文件再开始。", "");
    return;
  }
  // 只有音频通道需要 Web Audio，正弦通道用 audio 元素
  if (audOnEl.checked) {
    ensureCtx();
    try { await ctx.resume(); } catch (e) {}
  }

  running = true;
  runStartPerf = perfNow();
  if (ctx) runStartAudio = ctx.currentTime;
  for (const key of CH_KEYS) {
    chans[key].events = [];
    chans[key].rounds = 0;
    if (ctx) chans[key].cursor = ctx.currentTime + LEAD;
  }

  scheduleAhead();
  pumpTimer = setInterval(pump, PUMP_MS);
  uiTimer = setInterval(tickUI, 100);
  oscRoundNo = 0;
  oscPhase = "idle";
  if (chans.osc.enabled) oscRound();
  tickUI();
  post({
    tag: "player-start",
    latency: LATENCY,
    rate: ctx ? ctx.sampleRate : null,
    base: ctx && ctx.baseLatency ? ctx.baseLatency : null,
    state: ctx ? ctx.state : "no-ctx",
    engine: "webaudio-buffer",
    freq: currentFreq,
    wave: currentWave
  });

  startBtn.disabled = true;
  stopBtn.disabled = false;
  testBtn.disabled = true;
  setParamsDisabled(true);

  const ok = await acquireWakeLock();
  if (!ok && window.isSecureContext) {
    showNotice("没能拿到屏幕唤醒锁，屏幕可能会自动熄灭。" +
      "建议把系统设置里的<b>屏幕超时</b>调到最长，并插着充电器。", "");
  } else if (!window.isSecureContext) {
    showNotice("当前是 <b>HTTP 访问</b>，浏览器不允许网页保持屏幕常亮，" +
      "所以屏幕到时间仍会自动熄灭。<br>两个办法：把系统<b>屏幕超时</b>调到最长（部分机型有「永不」），" +
      "或者改用 HTTPS 地址打开本页。", "");
  } else {
    showNotice("运行中。保持页面在前台，不要手动锁屏，否则播放会停。", "ok");
  }
}

function setParamsDisabled(on) {
  [oscPlaySecEl, oscGapSecEl, audPlaySecEl, audGapSecEl].forEach(el => { el.disabled = on; });
}

function stop(silent) {
  running = false;
  if (pumpTimer) { clearInterval(pumpTimer); pumpTimer = null; }
  if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
  oscStop();

  const now = ctx ? ctx.currentTime : 0;
  for (const key of CH_KEYS) {
    const ch = chans[key];
    for (const ev of ch.events) {
      if (ev.start <= now && ev.end > now) fadeOut(ev, now);
      else { try { ev.node.stop(); } catch (e) {} }
    }
    ch.events = [];
    ch.cursor = 0;
  }

  releaseWakeLock();

  startBtn.disabled = false;
  stopBtn.disabled = true;
  testBtn.disabled = false;
  setParamsDisabled(false);

  stateLabel.textContent = "已停止";
  bigTimer.textContent = "--";
  bigTimer.className = "big-timer";
  timerHint.textContent = "等待开始";
  updateIdleLines();
  if (!silent) showNotice("已停止。", "");
}

// 试听一次：打开着的通道各响一轮
async function testOnce() {
  if (audOnEl.checked) {
    ensureCtx();
    try { await ctx.resume(); } catch (e) {}
    if (audioBuffer) scheduleOne("aud", ctx.currentTime + 0.05);
  }
  if (oscOnEl.checked) oscPreview();
  if (audOnEl.checked && !audioBuffer) {
    showNotice("只试听了正弦波：音频通道还没选文件。", "");
  } else if (!oscOnEl.checked && !audOnEl.checked) {
    showNotice("两个通道都关着，没什么可试听的。", "");
  }
}

// ---------- 唤醒锁 ----------
async function acquireWakeLock() {
  if (!("wakeLock" in navigator)) {
    wakeStateEl.textContent = "不支持";
    return false;
  }
  if (!window.isSecureContext) {
    wakeStateEl.textContent = "需 HTTPS";
    return false;
  }
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeStateEl.textContent = "已启用";
    wakeLock.addEventListener("release", () => {
      wakeStateEl.textContent = running ? "已释放" : "未启用";
    });
    return true;
  } catch (err) {
    wakeStateEl.textContent = "申请失败";
    return false;
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  wakeStateEl.textContent = "未启用";
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running) {
    await acquireWakeLock();
  }
});

// ---------- 全屏 ----------
let fsMarked = false;       // 历史里有一条专为全屏预留，返回键先吃掉它

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function syncFsButton() {
  fsBtn.textContent = isFullscreen() ? "退出全屏" : "全屏显示";
}

async function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) {
    showNotice("这个浏览器不支持网页全屏。iPhone 可以用浏览器分享菜单里的" +
      "<b>添加到主屏幕</b>，从主屏幕打开就没有地址栏。", "");
    return;
  }
  try {
    await req.call(el);
    // 不补这一条，返回键会直接离开页面而不是退出全屏
    history.pushState({ fullscreen: true }, "");
    fsMarked = true;
    syncFsButton();
  } catch (e) {
    showNotice("进入全屏失败：" + escapeHtml(String(e && e.message || e)), "err");
  }
}

async function exitFullscreenNow() {
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (ex && isFullscreen()) {
    try { await ex.call(document); } catch (e) {}
  }
  syncFsButton();
}

function leaveFullscreen() {
  exitFullscreenNow();
  if (fsMarked) { fsMarked = false; history.back(); }
}

// 全屏下按返回键：只退全屏，页面留着
window.addEventListener("popstate", () => {
  if (!isFullscreen()) return;
  fsMarked = false;
  exitFullscreenNow();
});

document.addEventListener("fullscreenchange", syncFsButton);
document.addEventListener("webkitfullscreenchange", syncFsButton);

// ---------- 界面刷新 ----------
function idleLine(key) {
  const on = key === "osc" ? oscOnEl.checked : audOnEl.checked;
  if (!on) return "已关闭";
  if (key === "aud" && !audioBuffer) return "等选文件";
  return "待命";
}

function updateIdleLines() {
  oscLineEl.textContent = idleLine("osc");
  oscLineEl.className = "";
  audLineEl.textContent = idleLine("aud");
  audLineEl.className = "";
}

// 每条通道自己的状态：正在响 / 静默倒计时 / 排程中
function viewOf(key, now) {
  const ch = chans[key];
  const { m, n } = paramsOf(key);
  while (ch.events.length && ch.events[0].end <= now) ch.events.shift();

  const period = m + n;
  ch.rounds = period > 0 ? Math.max(0, Math.floor((now - runStartAudio + 0.001) / period)) : 0;
  const tag = " · 第 " + (ch.rounds + 1) + " 轮";

  if (!ch.enabled) return { text: "已关闭", cls: "", live: false, left: null };
  const ev = ch.events[0];
  if (ev && ev.start <= now) {
    const left = ev.end - now;
    return { text: "播放中 " + left.toFixed(1) + "s" + tag, cls: "playing", live: true, left: left };
  }
  if (ev) {
    const left = Math.max(0, ev.start - now);
    return { text: "静默 " + left.toFixed(1) + "s" + tag, cls: "waiting", live: false, left: left };
  }
  return { text: loopOf(key) ? "排程中" : "本轮已播完", cls: "", live: false, left: null };
}

function tickUI() {
  if (!running) { updateIdleLines(); return; }
  const nowPerf = perfNow();
  elapsedEl.textContent = fmtClock(nowPerf - runStartPerf);

  const views = {};
  views.osc = oscView(nowPerf);
  views.aud = ctx ? viewOf("aud", ctx.currentTime) : { text: "已关闭", cls: "", live: false, left: null };
  oscLineEl.textContent = views.osc.text;
  oscLineEl.className = views.osc.cls;
  audLineEl.textContent = views.aud.text;
  audLineEl.className = views.aud.cls;

  // 大计时器优先显示正在响的那条，同时响时取先结束的；都在静默就取最近的下一次
  let pickKey = null;
  for (const key of CH_KEYS) {
    const v = views[key];
    if (v.live && (pickKey === null || v.left < views[pickKey].left)) pickKey = key;
  }
  if (pickKey === null) {
    for (const key of CH_KEYS) {
      const v = views[key];
      if (v.left !== null && (pickKey === null || v.left < views[pickKey].left)) pickKey = key;
    }
  }
  if (pickKey === null) {
    stateLabel.textContent = "排程中";
    bigTimer.textContent = "--";
    bigTimer.className = "big-timer";
    timerHint.textContent = "";
    return;
  }
  const pick = views[pickKey];
  stateLabel.textContent = pick.live ? "正在播放 · " + CH_NAME[pickKey] : "静默中 · " + CH_NAME[pickKey];
  bigTimer.textContent = pick.left.toFixed(1);
  bigTimer.className = "big-timer " + (pick.live ? "playing" : "waiting");
  timerHint.textContent = pick.live
    ? CH_NAME[pickKey] + " 本轮剩余"
    : CH_NAME[pickKey] + " 距离下次播放";
}

// ---------- 事件绑定 ----------
startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", () => stop(false));
testBtn.addEventListener("click", testOnce);
fsBtn.addEventListener("click", () => {
  if (isFullscreen()) leaveFullscreen(); else enterFullscreen();
});

// 参数改动只重排自己那条通道，不打断另一条
[[oscPlaySecEl, "osc"], [oscGapSecEl, "osc"], [audPlaySecEl, "aud"], [audGapSecEl, "aud"]]
  .forEach(pair => {
    pair[0].addEventListener("change", () => { if (running) reschedule(pair[1]); });
  });

oscLoopEl.addEventListener("change", () => {
  oscLoopDescEl.textContent = oscLoopEl.checked ? "播放完等间隔后自动再响" : "只响这一轮，播完就停";
  if (running) reschedule("osc");
});

audLoopEl.addEventListener("change", () => {
  audLoopDescEl.textContent = audLoopEl.checked ? "播放完等间隔后自动再响" : "只响这一轮，播完就停";
  if (running) reschedule("aud");
});

// 通道开关运行中即时生效，未运行时只改界面
oscOnEl.addEventListener("change", () => {
  chans.osc.enabled = oscOnEl.checked;
  oscBodyEl.classList.toggle("off", !oscOnEl.checked);
  if (running) toggleChannel("osc"); else updateIdleLines();
});

audOnEl.addEventListener("change", () => {
  chans.aud.enabled = audOnEl.checked;
  audBodyEl.classList.toggle("off", !audOnEl.checked);
  if (running) toggleChannel("aud"); else updateIdleLines();
});

// 幅度变化
const AMP_PRESETS = [
  { label: "0%", val: 0 },
  { label: "5%", val: 5 },
  { label: "10%", val: 10 },
  { label: "20%", val: 20 },
  { label: "30%", val: 30 },
  { label: "50%", val: 50 },
  { label: "70%", val: 70 },
  { label: "100%", val: 100 },
];

function buildAmpPresets() {
  const wrap = $("ampPresets");
  wrap.innerHTML = "";
  AMP_PRESETS.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "amp-preset-btn";
    btn.textContent = p.label;
    btn.addEventListener("click", () => {
      ampRangeEl.value = p.val;
      updateAmpDisplay();
    });
    wrap.appendChild(btn);
  });
}

function updateAmpDisplay() {
  const v = parseInt(ampRangeEl.value);
  ampValueEl.textContent = v + "%";
}

ampRangeEl.addEventListener("input", updateAmpDisplay);

// 两条通道各自的音量，实时生效，不用等下一轮
audVolEl.addEventListener("input", () => {
  audVolValueEl.textContent = parseInt(audVolEl.value) + "%";
  if (audVolGain) audVolGain.gain.value = volOf(audVolEl, 0.8);
});

oscVolEl.addEventListener("input", () => {
  oscVolValueEl.textContent = parseInt(oscVolEl.value) + "%";
  if (oscVolGain) oscVolGain.gain.value = volOf(oscVolEl, 1);
});

// ---------- 文件导入与解码 ----------
fileInput.addEventListener("change", async () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  fileBtnText.textContent = "已选择，点击可更换";
  fileBtn.classList.add("has-file");
  fileInfo.classList.remove("hidden");
  fileInfo.innerHTML = "<b>" + escapeHtml(f.name) + "</b><br>正在解码…";

  try {
    ensureCtx();
    const ab = await f.arrayBuffer();
    const decoded = await new Promise((res, rej) => {
      const p = ctx.decodeAudioData(ab, res, rej);
      if (p && p.then) p.then(res, rej);
    });
    audioBuffer = decoded;
    fileInfo.innerHTML = "<b>" + escapeHtml(f.name) + "</b><br>时长 " +
      fmtDur(audioBuffer.duration) + " · " + audioBuffer.numberOfChannels + " 声道 · " +
      audioBuffer.sampleRate + " Hz";
    if (audioBuffer.duration > 600) {
      showNotice("这段素材超过 10 分钟，解码后整段常驻内存，手机可能因此丢掉页面。" +
        "建议换一段短的。", "");
    }
    // 运行中换素材：本通道从当前时刻重新起排
    if (running && chans.aud.enabled) {
      chans.aud.cursor = ctx.currentTime + 0.1;
      scheduleAhead();
    }
    tickUI();
  } catch (err) {
    audioBuffer = null;
    fileInfo.innerHTML = "<b>" + escapeHtml(f.name) + "</b><br>解码失败";
    showNotice("解码失败：" + escapeHtml(String(err && err.message || err)) +
      "<br>请换一个常见的音频格式，比如 mp3 或 m4a。", "err");
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// 页面被切走时提醒
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && running) {
    showNotice("页面已切到后台，浏览器会暂停音频并释放唤醒锁。" +
      "请切回本页面继续。", "err");
  }
});

window.addEventListener("pagehide", () => { if (running) stop(true); });

// 启动
(function init() {
  buildPresets();
  buildAmpPresets();
  freqSlider.value = freqToSlider(currentFreq);
  updateFreqDisplay();
  updateAmpDisplay();
  updateIdleLines();
  syncFsButton();

  if (!window.isSecureContext) {
    showNotice("当前地址不是安全上下文（HTTP 访问）。播放功能正常，" +
      "但浏览器不允许网页阻止屏幕熄灭。<br>解决办法：把系统<b>屏幕超时</b>调到最长，" +
      "或改用 HTTPS 地址打开。", "");
  } else if (!("wakeLock" in navigator)) {
    showNotice("这个浏览器不支持屏幕唤醒锁，请把系统<b>屏幕超时</b>调到最长。", "");
  }
})();
</script>
